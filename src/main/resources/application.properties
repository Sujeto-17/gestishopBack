# ===============================================
# SPRING APPLICATION CONFIG
# ===============================================
spring.application.name=gestishop
server.address=0.0.0.0
server.port=@cf.server.port@

# ===============================================
# DATABASE CONFIGURATION
# ===============================================
spring.datasource.url=@cf.spring.datasource.url@
spring.datasource.username=@cf.spring.datasource.username@
spring.datasource.password=@cf.spring.datasource.password@
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / HIBERNATE
# ===============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=@cf.spring.jpa.show-sql@
spring.jpa.hibernate.ddl-auto=none

# ===============================================
# TIMEZONE
# ===============================================
spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# ===============================================
# ARCHIVOS / MULTIPART
# ===============================================
media.location=@cf.media.location@
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================================
# SWAGGER / OPENAPI
# ===============================================
springdoc.api-docs.enabled=@cf.springdoc.api-docs.enabled@
springdoc.swagger-ui.enabled=@cf.springdoc.swagger-ui.enabled@

spring.profiles.active=@current.profile@